services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SQLITE_PATH: /data/ballard.sqlite
      INGEST_API_KEY: ${INGEST_API_KEY:-local-dev-ingest-key}
    ports:
      - "8080:8080"
    volumes:
      - app-data:/data

  scrapers:
    build:
      context: .
      dockerfile: scrapers/Dockerfile
    environment:
      BACKEND_INGEST_URL: http://backend:8080
      INGEST_API_KEY: ${INGEST_API_KEY:-local-dev-ingest-key}

volumes:
  app-data:
